<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>RigWatch</title>
  <link rel="icon" href="assets/icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <nav class="nav" aria-label="Sections">
    <div class="brand">
      <img class="brand-mark" src="assets/icon.png" alt="" width="28" height="28" onerror="this.remove()">
      <span class="brand-name">RigWatch</span>
    </div>
    <ul class="nav-list" id="nav"></ul>
    <div class="nav-foot">
      <ul class="nav-list" id="nav-foot"></ul>
      <div class="live" id="live" title="Connection to the sensor service">
        <span class="live-dot" aria-hidden="true"></span>
        <span class="live-text" id="live-text">Connecting…</span>
      </div>
    </div>
  </nav>

  <div class="main" id="main" tabindex="-1">
    <header class="top">
      <div class="top-title">
        <h1 id="page-title">Overview</h1>
        <p id="page-sub" class="muted"></p>
      </div>
      <div class="top-tools">
        <div class="seg" id="range" role="group" aria-label="Chart time range"></div>
        <button class="btn" id="mini-btn" type="button" title="Compact always-on-top view">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M3 4.5A1.5 1.5 0 0 1 4.5 3h11A1.5 1.5 0 0 1 17 4.5v11a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 15.5z" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="10" y="10" width="5" height="5" rx="1" fill="currentColor"/></svg>
          <span>Mini</span>
        </button>
      </div>
    </header>
    <main id="view"></main>
  </div>

  <section class="mini" id="mini" aria-label="Compact monitor" hidden></section>

  <dialog class="dialog" id="dialog">
    <form method="dialog">
      <h2 id="dialog-title"></h2>
      <div id="dialog-body"></div>
      <div class="dialog-actions"><button class="btn btn-primary" value="ok">Close</button></div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
